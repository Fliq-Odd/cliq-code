name: C++ Engine CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src_cpp/**'
      - '.github/workflows/cpp_ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'src_cpp/**'
      - '.github/workflows/cpp_ci.yml'

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies (pybind11)
      run: python -m pip install --upgrade pip pybind11

    - name: Configure CMake
      # Working directory is the root.
      # We tell CMake that the source is in `src_cpp` (where CMakeLists.txt is).
      run: cmake -B build -S src_cpp -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build C++ Engine
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Run C++ Tests
      working-directory: build
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./${{ matrix.build_type }}/engine_test.exe
        else
          ./engine_test
        fi
      shell: bash
